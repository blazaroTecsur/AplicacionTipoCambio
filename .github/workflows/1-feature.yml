# Objetivo: Dar feedback rápido al desarrollador
# Actualmente tu pipeline valida:
#   Dependencias NuGet válidas
#   Proyecto compila
#   Dockerfile funciona
#   Imagen Docker puede construirse
# Esto evita aproximadamente el 70% de los errores más comunes.
# Pensar más adelante en agregar pruebas unitarias, seguridad, control de calidad, etc.

name: CI Feature v1

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NUGET_USERNAME: ${{ github.actor }}
      NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Docker Build
        run: |
          docker build \
            --build-arg NUGET_USERNAME=${{ github.actor }} \
            --build-arg NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t wrk-tcambio-test \
            -f Dockerfile .