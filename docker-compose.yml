services:
  nginx:
    image: nginx:alpine
    container_name: tasacambio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasacambio-api
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=10.160.9.18,1433;Database=erp_tecsur_pinterna;User Id=tecsur_root;Password=Tecsur2021$;SslMode=None;
      - Seguridad__ApiKey=${API_KEY}
      - Serilog__SeqUrl=http://seq:5341
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.3
    container_name: tasacambio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root1234!
      MYSQL_DATABASE: tasa_cambio_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: tasacambio-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  mysql_data:
  seq_data:
