services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker
      args:
        GITHUB_USER: ${GITHUB_USER}
        NUGET_TECSUR_TOKEN: ${NUGET_TECSUR_TOKEN}
    container_name: tasacambio-worker
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Sbs__UrlXml=${URL_XML}
      - Sbs__UrlHtml=${URL_HTML}
      - Sbs__HoraInicioRegistro=${HORA_INICIO_REGISTRO}
      - Sbs__HoraFinRegistro=${HORA_FIN_REGISTRO}
      - Sbs__IntervaloBusquedaMinutos=${INTERVALO_BUSQUEDA_MINUTOS}
      - Sbs__ValidacionPartesEnteras=${VALIDACION_PARTES_ENTERAS}
      - Sbs__ValidacionPartesDecimales=${VALIDACION_PARTES_DECIMALES}
      - Sbs__Monedas__0=${SBS_MONEDA_0:-USD}
      - Sbs__Monedas__1=${SBS_MONEDA_1:-EUR}
      - ApiSettings__Infor__BaseUrl=${INFOR_BASE_URL}
      - ApiSettings__Infor__SsoBaseUrl=${INFOR_SSO_URL}
      - ApiSettings__Infor__Tenant=${INFOR_TENANT}
      - ApiSettings__Infor__ClientId=${INFOR_CLIENT_ID}
      - ApiSettings__Infor__ClientSecret=${INFOR_CLIENT_SECRET}
      - ApiSettings__Infor__ServiceAccountKey=${INFOR_SERVICE_ACCOUNT_KEY}
      - ApiSettings__Infor__ServiceAccountSecret=${INFOR_SERVICE_ACCOUNT_SECRET}
      - ApiSettings__Infor__AppId=${INFOR_APP_ID}
      - ApiSettings__Infor__Configuration=${INFOR_MONGOOSE}
      - Serilog__SeqUrl=http://seq:5341
      - TZ=America/Lima
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.3
    container_name: tasacambio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/sql/01_crear_base_datos.sql:/docker-entrypoint-initdb.d/01_crear_base_datos.sql:ro
      - ./scripts/sql/02_crear_tablas.sql:/docker-entrypoint-initdb.d/02_crear_tablas.sql:ro
      - ./scripts/sql/03_datos_iniciales.sql:/docker-entrypoint-initdb.d/03_datos_iniciales.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: tasacambio-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  mysql_data:
  seq_data:
